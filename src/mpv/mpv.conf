# Low-overhead Direct3D 11 backend
vo=gpu
gpu-api=d3d11
gpu-context=d3d11
d3d11-exclusive-fs=no

# Hardware Decoding via Intel QuickSync
hwdec=d3d11va
profile=fast

# Eliminate tearing and micro-stutter
video-sync=audio
interpolation=no
dscale=bilinear
cscale=bilinear
scale=bilinear

# Strict memory and thread limits
demuxer-max-bytes=4MiB
demuxer-readahead-secs=0
vd-lavc-threads=2

# Audio and Screensaver
audio=no
volume=0
stop-screensaver=no
priority=below-normal

# Required by AutoWall (do not modify)
border=no
force-window=yes
player-operation-mode=pseudo-gui
loop=inf
